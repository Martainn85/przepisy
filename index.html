<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fit Przepisy | Śniadania i Obiady</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,900;1,9..144,500&family=Karla:wght@400;500;700&display=swap');

:root{
  --bg:#f6efe4;
  --card:#fffdf8;
  --ink:#2b211c;
  --muted:#8a7a6d;
  --berry:#8c2f4a;
  --berry-soft:#b9456a;
  --leaf:#5a7a4f;
  --line:#e3d8c7;
  --shadow:0 1px 2px rgba(43,33,28,.04),0 8px 28px rgba(43,33,28,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:'Karla',sans-serif;
  background:var(--bg);
  color:var(--ink);
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:radial-gradient(rgba(140,47,74,.04) 1px,transparent 1px);
  background-size:22px 22px;
}

/* HEADER */
header{
  position:sticky;top:0;z-index:50;
  background:rgba(246,239,228,.92);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.head-inner{max-width:1100px;margin:0 auto;padding:18px 22px 0}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand h1{
  font-family:'Fraunces',serif;font-weight:900;font-size:clamp(28px,5vw,46px);
  color:var(--berry);letter-spacing:-.01em;line-height:.95;font-style:italic;
}
.brand span{font-size:13px;color:var(--muted);letter-spacing:.18em;text-transform:uppercase;font-weight:700}

.controls{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:16px 0 14px}
.search{
  flex:1;min-width:200px;position:relative;
}
.search input{
  width:100%;padding:11px 14px 11px 40px;border:1px solid var(--line);
  border-radius:40px;background:var(--card);font-family:inherit;font-size:15px;color:var(--ink);
  outline:none;transition:border-color .2s,box-shadow .2s;
}
.search input:focus{border-color:var(--berry-soft);box-shadow:0 0 0 3px rgba(185,69,106,.12)}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
.count{font-size:13px;color:var(--muted);white-space:nowrap;font-weight:500}

.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:14px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  border:1px solid var(--line);background:var(--card);color:var(--muted);
  padding:7px 15px;border-radius:30px;font-family:inherit;font-size:13.5px;font-weight:700;
  cursor:pointer;white-space:nowrap;transition:all .18s;
}
.tab:hover{color:var(--ink);border-color:var(--berry-soft)}
.tab.active{background:var(--berry);color:#fff;border-color:var(--berry)}

/* GRID */
main{max-width:1100px;margin:0 auto;padding:26px 22px 80px;position:relative;z-index:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;
  cursor:pointer;box-shadow:var(--shadow);transition:transform .18s,box-shadow .18s,border-color .18s;
  display:flex;flex-direction:column;gap:12px;
}
.card:hover{transform:translateY(-3px);box-shadow:0 12px 34px rgba(43,33,28,.1);border-color:var(--berry-soft)}
.card .cat{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--berry-soft);font-weight:700}
.card h3{font-family:'Fraunces',serif;font-size:21px;font-weight:600;line-height:1.15;color:var(--ink)}
.card .meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:auto;font-size:12.5px;color:var(--muted)}
.kcal{font-weight:700;color:var(--berry);font-size:15px;font-family:'Fraunces',serif}
.time{display:inline-flex;align-items:center;gap:4px}
.macros{display:flex;gap:6px;flex-wrap:wrap}
.macro{font-size:11px;background:var(--bg);border:1px solid var(--line);padding:2px 8px;border-radius:20px;font-weight:700;color:var(--muted)}
.macro b{color:var(--ink)}

.empty{text-align:center;color:var(--muted);padding:60px 20px;font-size:17px}

/* MODAL */
.overlay{
  position:fixed;inset:0;z-index:100;background:rgba(43,33,28,.55);
  backdrop-filter:blur(4px);display:none;align-items:flex-start;justify-content:center;
  padding:20px;overflow-y:auto;
}
.overlay.open{display:flex}
.modal{
  background:var(--card);max-width:680px;width:100%;border-radius:20px;
  margin:auto;box-shadow:0 30px 80px rgba(43,33,28,.35);overflow:hidden;
  animation:pop .25s ease;
}
@keyframes pop{from{transform:translateY(14px) scale(.98);opacity:0}to{transform:none;opacity:1}}
.modal-head{
  padding:28px 30px 22px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,rgba(140,47,74,.05),transparent);position:relative;
}
.modal-head .cat{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--berry-soft);font-weight:700}
.modal-head h2{font-family:'Fraunces',serif;font-style:italic;font-weight:900;font-size:clamp(26px,4vw,36px);color:var(--berry);line-height:1.05;margin:6px 0 14px}
.modal-head .sub{font-size:14px;color:var(--muted)}
.close{
  position:absolute;top:18px;right:18px;width:38px;height:38px;border-radius:50%;
  border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:20px;color:var(--muted);
  display:grid;place-items:center;transition:all .18s;line-height:1;
}
.close:hover{background:var(--berry);color:#fff;border-color:var(--berry);transform:rotate(90deg)}

.modal-body{padding:24px 30px 32px;max-height:62vh;overflow-y:auto}
.modal-body h4{
  font-family:'Fraunces',serif;font-weight:600;font-size:19px;margin:22px 0 10px;color:var(--ink);
  display:flex;align-items:center;gap:9px;
}
.modal-body h4:first-child{margin-top:0}
.modal-body h4::before{content:"";width:18px;height:2px;background:var(--berry-soft);border-radius:2px}
.modal-body ul{list-style:none;display:flex;flex-direction:column;gap:7px}
.modal-body ul li{padding-left:20px;position:relative;font-size:14.5px}
.modal-body ul li::before{content:"";position:absolute;left:4px;top:9px;width:6px;height:6px;border-radius:50%;background:var(--leaf)}
.modal-body ol{list-style:none;counter-reset:step;display:flex;flex-direction:column;gap:12px}
.modal-body ol li{counter-increment:step;padding-left:38px;position:relative;font-size:14.5px}
.modal-body ol li::before{
  content:counter(step);position:absolute;left:0;top:-1px;width:26px;height:26px;border-radius:50%;
  background:var(--berry);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700;font-family:'Fraunces',serif;
}
.note{font-size:13.5px;color:var(--muted);font-style:italic;margin-top:8px}

.nutri{margin-top:24px;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.nutri table{width:100%;border-collapse:collapse;font-size:14px}
.nutri th,.nutri td{padding:9px 12px;text-align:center;border-bottom:1px solid var(--line)}
.nutri thead th{background:var(--bg);font-family:'Karla';font-weight:700;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.nutri tbody tr:last-child td{border-bottom:none}
.nutri td:first-child{text-align:left;font-weight:700;color:var(--ink)}
.nutri td.kc{color:var(--berry);font-weight:700;font-family:'Fraunces',serif}

footer{text-align:center;padding:30px 20px 50px;color:var(--muted);font-size:13px;position:relative;z-index:1}
footer a{color:var(--berry);text-decoration:none;font-weight:700}

@media(max-width:560px){
  .head-inner{padding:14px 16px 0}
  main{padding:20px 16px 60px}
  .modal-head,.modal-body{padding-left:20px;padding-right:20px}
}
</style>
</head>
<body>
<header>
  <div class="head-inner">
    <div class="brand">
      <h1>Fit Przepisy</h1>
      <span>Przepisy w jednym miejscu</span>
    </div>
    <div class="controls">
      <div class="search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>
        <input id="search" type="text" placeholder="Szukaj przepisu lub składnika...">
      </div>
      <span class="count" id="count"></span>
    </div>
    <div class="tabs" id="tabs"></div>
  </div>
</header>

<main>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none">Brak przepisów dla tego wyszukiwania.</div>
</main>

<footer>
  Na podstawie ebooków <b>„Fit Śniadania”</b>, <b>„Fit Obiady”</b> i <b>„Fit Fast Food”</b> Krzysztofa Domaszewskiego &middot; <a href="https://www.fitslodycze.pl" target="_blank" rel="noopener">fitslodycze.pl</a><br>
  Wartości: kcal &middot; B białko &middot; T tłuszcz &middot; W węglowodany (g)
</footer>

<div class="overlay" id="overlay">
  <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
</div>

{cat:"Śniadania", name:"Omlet Capricciosa", portions:"1 omlet", time:"15 min",
 ing:["2 jaja kurze (L)","35g płatków owsianych błyskawicznych (lub jaglane, komosa)","Ok. 75g sera żółtego (np. mozzarella)","2 średnie pieczarki","30-40g chudej wędliny drobiowej","Przyprawy: sól, pieprz, oregano, czosnek granulowany","Koncentrat pomidorowy","1 łyżeczka erytrytolu lub ksylitolu"],

 ing:["3 jaja kurze (L)","Ok. 35g sera feta","Warzywa: pomidorki koktajlowe, cebula czerwona, zielenina (rukola, szpinak, sałaty)","Przyprawy: sól, pieprz, suszone oregano","Oliwa z oliwek","Ocet balsamiczny","Koncentrat pomidorowy"],

{cat:"Obiady", name:"Burger Pielgrzyma", portions:"1 kanapka", time:"20 min",
 ing:["Miękka bułka ok. 60g","75-100g piersi z indyka lub kurczaka","1-2 plastry żółtego sera","1 łyżeczka oliwy z oliwek (lub olej, masło klarowane)","1 łyżeczka chrzanu","1 łyżka konfitury (np. żurawinowej)","Odrobina soku z limonki lub cytryny","1 mała szalotka lub kilka plastrów cebuli, drobno","Kilka listków sałaty lub rukoli","Przyprawy do mięsa: papryka słodka, sól, pieprz ziołowy, chili lub cayenne, mielona kolendra"],
 steps:["Mięso kroimy na podłużne kawałki i obtaczamy w przyprawach.","Grillujemy na suchej patelni na średnim ogniu lub pieczemy 12-15 minut w 180°C (góra-dół). Czas zależy od grubości.","Gotowe mięso przekładamy do miski, dodajemy 1 łyżeczkę tłuszczu i mieszamy, aż się pokryje.","Konfitura żurawinowa: ok. 100g suszonej żurawiny zalewamy wrzątkiem, czekamy aż zmięknie. Odcedzamy (wody nie wylewamy), blendujemy z 1 łyżką miodu lub syropu klonowego na gładką pastę. Można dodać 2-3 łyżki wody żurawinowej.","Bułkę kroimy na pół, najlepiej nie do końca.","Dół smarujemy chrzanem, posypujemy oregano i czosnkiem granulowanym. Dodajemy cebulę, mięso i ser. Wkładamy do mocno rozgrzanego piekarnika na minutę-dwie, aż ser się roztopi.","Dodajemy 1 łyżkę konfitury, skrapiamy sokiem z limonki, dekorujemy sałatą."],
 note:"Wege: kurczaka zamień na płaski plaster tofu grillowany na sucho do zarumienienia, potem obtocz w oliwie z przyprawami. Ser pomiń lub użyj wegańskiego.",
 nutri:[{l:"całość",kcal:459,b:34,t:13,w:40},{l:"w 100 g",kcal:230,b:17,t:7,w:20}]},

{cat:"Obiady", name:"Cajun z Grilla", portions:"2 porcje", time:"20 min (+ marynowanie opcj. 1h)",
 ing:["300-400g chudego schabu (lub pierś z kurczaka, indyka)","1 łyżeczka papryki słodkiej w proszku","1 łyżeczka papryki wędzonej w proszku","1 łyżeczka suszonego oregano","1 łyżeczka erytrytolu lub ksylitolu","½ łyżeczki mielonego cayenne lub chili","Szczypta-dwie suszonego tymianku","Szczypta czarnego pieprzu","1 mały ząbek czosnku, wyciśnięty lub starty","Trochę cebuli startej, do smaku","1 łyżeczka jasnego sosu sojowego","30ml soku z pomarańczy"],
 steps:["Marynata: składniki mieszamy w misce do ujednolicenia.","Mięso kroimy na plastry ok. 1 cm, odkrawamy tłuszcz, obtaczamy w marynacie. Można marynować ok. 1h w lodówce, ale nie jest to konieczne.","Smażymy na rozgrzanej patelni bez tłuszczu na średnim ogniu. Schab ok. 3 minuty z każdej strony. Czas zależy od grubości i rodzaju mięsa, uważać żeby nie przesuszyć.","Sos do polania: do pozostałej marynaty dodajemy 1 łyżkę oliwy i 1-2 łyżki soku z pomarańczy. Polewamy mięso. Podajemy z domowymi frytkami."],
 note:"Wege: mięso zamień na płaskie plastry tofu, można grillować bez marynowania do zarumienienia. Marynatę podgrzej z oliwą i polej tofu.",

{cat:"Obiady", name:"Chili Con Carne", portions:"1 porcja", time:"20 min",
 ing:["100g mielonej wołowiny (lub mielony drób w wersji lżejszej)","½ średniej cebuli lub spora szalotka","1 ząbek czosnku","1 ostra papryczka średniej wielkości","50g czerwonej fasoli z puszki, bez zalewy","ok. 100g passaty pomidorowej 100%","1 łyżka erytrytolu lub ksylitolu","Mieszanka przypraw: 1,5 łyżki kminu rzymskiego, 1 łyżeczka cayenne lub chili, 1 łyżeczka oregano, 1 płaska łyżeczka słodkiej papryki, szczypta soli i pieprzu, opcjonalnie szczypta cynamonu","2 łyżki oliwy lub oleju kokosowego do smażenia","Opcjonalnie: dymka lub pietruszka"],

 note:"Wege: mięso zamień na ugotowaną kaszę gryczaną. Do smażenia dodaj 1-2 drobno skrojone pieczarki i 1 łyżeczkę papryki wędzonej.",
 nutri:[{l:"całość",kcal:426,b:29,t:29,w:8},{l:"drobiowe",kcal:323,b:28,t:19,w:8},{l:"w 100 g",kcal:142,b:10,t:10,w:3}]},

 ing:["1 puszka ciecierzycy (240g) bez zalewy","1 łyżka siemienia lnianego","Drobno posiekana natka pietruszki (lub kolendra, bazylia, oregano)","1 łyżeczka słodzika (erytrytol lub ksylitol zmielony)","1 łyżeczka kminu rzymskiego (lub pięć smaków, garam masala)","1 łyżeczka chili lub cayenne","1 łyżeczka czosnku granulowanego","Szczypta soli i pieprz z młynka","3 łyżki bułki tartej lub przemielonych płatków","2 łyżki oliwy z oliwek","Sos czosnkowo-chrzanowy: 4 łyżki jogurtu naturalnego lub roślinnego, 1 łyżeczka słodzika, 1-2 łyżeczki chrzanu, 1 łyżeczka czosnku granulowanego lub 1 ząbek wyciśnięty, pieprz z młynka"],

{cat:"Obiady", name:"Fit Bolognese", portions:"1 porcja", time:"20 min",
 ing:["100g mielonego mięsa (u autora drobiowe)","50g makaronu spaghetti","3 łyżki passaty pomidorowej","1 łyżka mleka (może być roślinne)","1-2 łyżeczki erytrytolu lub ksylitolu","½ niedużej marchewki","½ cebuli","1 łyżka oliwy z oliwek do smażenia","Przyprawy: sól, pieprz, papryka wędzona, czosnek granulowany","Opcjonalnie: parmezan lub inny ser, bazylia lub oregano"],
 steps:["Makaron gotujemy wg opakowania.","Cebulę szatkujemy drobno. Na głębokiej patelni rozgrzewamy oliwę, wrzucamy cebulę na 30 sekund, dodajemy mięso. Smażymy mieszając, aż zmieni kolor.","Dodajemy przyprawy. Przy drobiowym mięsie co najmniej 1 łyżeczkę papryki wędzonej. Smażymy dalej.","Dodajemy słodzik, passatę i mleko. Mieszamy, próbujemy, doprawiamy. Trzymamy kilka minut, aż sos zgęstnieje. Marchewkę można zagotować z makaronem lub dorzucić na patelnię.","Makaron odcedzamy, przekładamy do miski, na to mięso z warzywami. Dekorujemy ziołami i serem."],
 note:"Wege: mięso zamień na ugotowaną kaszę gryczaną. Do smażenia dodaj 1-2 pieczarki i 1 łyżeczkę papryki wędzonej, można więcej warzyw i przypraw.",
 nutri:[{l:"całość",kcal:399,b:33,t:13,w:38},{l:"w 100 g",kcal:133,b:11,t:4,w:13}]},

{cat:"Obiady", name:"Fitburger Drobiowy", portions:"1 burger", time:"15 min",
 ing:["1 miękka bułka ok. 60-75g","100g piersi z kurczaka lub indyka w płaskich kawałkach","Przyprawy do mięsa: pieprz z młynka, papryka słodka, papryka wędzona","Warzywa: sałata, cebula, pomidor","1 łyżka oliwy z oliwek (lub olej lniany, rzepakowy, masło klarowane)","Sos BBQ: 1 łyżeczka syropu klonowego lub miodu, szczypta papryki wędzonej, odrobina ciemnego sosu sojowego, pieprz z młynka"],
 steps:["Mięso kroimy w płaskie kawałki i obtaczamy w przyprawach. Grillujemy na rozgrzanej patelni bez tłuszczu z dwóch stron do zarumienienia, uważając żeby nie przesuszyć.","Bułkę kroimy na pół i podpiekamy w piekarniku lub na suchej patelni od środka.","Składniki sosu mieszamy w misce. Mięso przekładamy do sosu i obtaczamy.","Obie części bułki nacieramy od środka tłuszczem. Dodajemy warzywa i mięso."],
 note:"Wege: kurczaka zamień na płaski plaster tofu grillowany na sucho do zarumienienia, potem obtocz w oliwie z przyprawami.",
 nutri:[{l:"całość",kcal:408,b:28,t:11,w:45},{l:"w 100 g",kcal:163,b:11,t:4,w:18}]},

{cat:"Obiady", name:"Klopsy Drobiowe", portions:"2 porcje (10-12 klopsów)", time:"30 min",
 ing:["200g mielonego mięsa drobiowego","2 łyżki płatków błyskawicznych (owsiane, gryczane, orkiszowe, z komosy) lub bułka tarta","Drobno posiekana pietruszka lub kolendra, do smaku","Oliwa z oliwek lub masło klarowane","Przyprawy: 2 łyżeczki papryki słodkiej, 2 łyżeczki majeranku, 1 łyżeczka pieprzu ziołowego, szczypta soli i pieprzu, ½ łyżeczki cayenne lub chili, ½ ząbka czosnku","Sos pomidorowy: 5-6 łyżek passaty, 1 łyżeczka słodkiej papryki, ½ ząbka czosnku, 1 łyżka oregano, szczypta pieprzu, 1-2 łyżeczki erytrytolu, opcjonalnie 1 łyżeczka oliwy"],
 steps:["Płatki przemielamy lekko w blenderze (nie na mąkę, mają być trochę drobniejsze od otrębów).","Mięso, płatki, pietruszkę i przyprawy mieszamy w misce i zagniatamy. Lepimy 10-12 okrągłych klopsów.","Pieczemy na folii 15 minut w 200°C (góra-dół).","Po upieczeniu przekładamy do miski, dodajemy 1-2 łyżeczki oliwy lub masła klarowanego i mieszamy. Podajemy z makaronem spaghetti, sosem pomidorowym i ziołami. Makaron można zamienić na kaszę gryczaną."],
 note:"Wartości na porcję obejmują ⅓ klopsów wraz z 75g makaronu lub kaszy, sosem i oliwą.",
 nutri:[{l:"całość",kcal:383,b:53,t:12,w:14},{l:"na porcję",kcal:457,b:31,t:7,w:70},{l:"w 100 g",kcal:152,b:10,t:2,w:23}]},

{cat:"Obiady", name:"Kurczak Gong Bao", portions:"2 porcje (ok. 500g)", time:"25 min",
 ing:["450-500g piersi z kurczaka","Marynata: 1 łyżeczka cayenne lub chili, 1 łyżeczka sosu sojowego (najlepiej ciemnego)","1 ząbek czosnku starty lub 1 łyżeczka czosnku granulowanego","Mały kawałek imbiru startego lub 1 łyżeczka imbiru w proszku","½ średniej cebuli, drobno","Ostra papryczka, drobno, do smaku","½ łyżeczki octu (ryżowy, winny, balsamiczny)","1 łyżka mąki ziemniaczanej lub tapioki","1 łyżeczka ciemnego sosu sojowego","1 łyżeczka słodzika","ok. 25g orzechów ziemnych (lub nerkowce, migdały)","Dymka (zielona część)","Kilka łyżek wrzątku","3 łyżki oleju kokosowego, oliwy lub masła klarowanego"],
 steps:["Mięso kroimy na małe kawałki, osuszamy. Mieszamy z cayenne i sosem sojowym.","Rozgrzewamy tłuszcz w woku lub głębokiej patelni i smażymy kurczaka na dużym ogniu, mieszając, aż zmieni kolor.","Dodajemy cebulę, imbir, czosnek, papryczkę. Smażymy do miękkości mięsa. W trakcie dodajemy ocet, słodzik, sos sojowy, trochę dymki.","Gdy kurczak gotowy, dodajemy wrzątek i mąkę ziemniaczaną, mieszamy aż sos zgęstnieje. Wyłączamy ogień, dodajemy resztę dymki i orzechy. Podajemy z ryżem i surówką z białej kapusty."],
 note:"Wege: kurczaka zamień na tofu lub tempeh. Wartości z ryżem dotyczą ⅓ całości i 50g ryżu.",
 nutri:[{l:"całość",kcal:903,b:108,t:46,w:8},{l:"na porcję",kcal:452,b:54,t:23,w:4},{l:"z ryżem",kcal:486,b:39,t:15,w:44}]},

{cat:"Obiady", name:"Leczo z Kurczakiem", portions:"2 porcje", time:"25 min",
 ing:["ok. 300g piersi z kurczaka","½ czerwonej papryki","½ zielonej papryki","½ średniej cebuli","⅓ średniej cukinii","Na sos: passata pomidorowa, wrzątek, mąka ziemniaczana, 1 łyżka słodzika","Przyprawy: po 1 łyżeczce papryki słodkiej, chili lub cayenne, czosnku granulowanego, pieprzu ziołowego, szczypta soli i pieprz z młynka","3 łyżki oliwy z oliwek lub masła klarowanego"],
 steps:["Warzywa kroimy na małe kawałki.","Kurczaka kroimy na małe kawałki, grillujemy na rozgrzanej patelni na średnim ogniu, aż zmieni kolor.","Przekładamy do garnka, dodajemy warzywa, ½ szklanki wrzątku, przyprawy, słodzik i 10 łyżek passaty. Doprowadzamy do wrzenia, zmniejszamy ogień, gotujemy ok. 10 minut z uchyloną pokrywką. Kto woli miękkie warzywa, przegotowuje je wcześniej.","Dodajemy 1 łyżkę mąki ziemniaczanej, mieszamy do zgęstnienia. Dodajemy oliwę lub masło. Podajemy z domowymi bułkami lub pieczywem."],
 note:"Wege: kurczaka zamień na tofu lub tempeh, grillowane na sucho do zarumienienia. Wartości z pieczywem dotyczą ½ porcji i 60-70g pieczywa.",
 nutri:[{l:"całość",kcal:585,b:69,t:30,w:0},{l:"na porcję",kcal:293,b:35,t:15,w:0},{l:"z pieczywem",kcal:476,b:40,t:16,w:38}]},

{cat:"Obiady", name:"Naleśniki a'la Lasagne", portions:"6 naleśników", time:"40 min",
 ing:["Ciasto: 120g mąki (uniwersalna typ 500, bezglutenowa, ryżowa, pełnoziarnista), 2 jaja (L), 200ml mleka, 200ml wody gazowanej, oliwa lub olej kokosowy do smażenia","Farsz: 200g mielonej wołowiny (lub drób + papryka wędzona), 1 spora cebula, ok. 10 łyżek passaty, 1 łyżka słodzika, przyprawy (czosnek granulowany, sól, pieprz, oregano, papryka słodka, szczypta chili), 2 łyżki oliwy lub oleju kokosowego","Dodatkowo: ser do zapiekania (mozzarella, 1 plaster na naleśnik), zioła","Szybki sos beszamelowy: 5 łyżek jogurtu, 2 łyżki bezsmakowego oleju lub rafinowanej oliwy, pieprz, szczypta gałki muszkatołowej, opcjonalnie szczypta soli"],
 steps:["Masa naleśnikowa: jaja, mleko, wodę gazowaną i mąkę blendujemy do ujednolicenia.","Smażymy 6 naleśników na średnim ogniu, smarując patelnię odrobiną tłuszczu. Po każdym strząsamy resztki, przed kolejnym dodajemy tłuszcz i rozsmarowujemy pędzlem.","Farsz: na patelni smażymy mięso z drobno skrojoną cebulą.","Dodajemy passatę, przyprawy, słodzik. Mieszamy, próbujemy, doprawiamy.","Gdy sos zgęstnieje, przekładamy farsz na naleśniki i składamy w ćwiartki. Można obsmażyć dla chrupkości.","Na każdy naleśnik kładziemy plaster sera, zapiekamy w 220°C do roztopienia. Polewamy beszamelem, posypujemy ziołami."],
 note:"Wege: mięso zamień na ugotowaną kaszę gryczaną z 1-2 pieczarkami i papryką wędzoną. Wartości drobiowe: 236 kcal na porcję.",
 nutri:[{l:"całość",kcal:1621,b:105,t:85,w:103},{l:"na porcję",kcal:270,b:17,t:14,w:17},{l:"drobiowe",kcal:236,b:17,t:11,w:17}]},

{cat:"Obiady", name:"Naleśniki z Kurczakiem i Szpinakiem", portions:"3 naleśniki", time:"30 min",
 ing:["Ciasto: 1 jajo (L), 200ml mleka (może roślinne), 60g mąki (pszenna, żytnia, orkiszowa, kukurydziana, gryczana, jaglana, bezglutenowa), oliwa lub olej kokosowy","Farsz: 150g piersi z kurczaka lub indyka, przyprawy (pieprz, sól, oregano, czosnek), ok. 10g listków szpinaku, mały kawałek cebuli, 2 łyżki jogurtu naturalnego (lub roślinny, mleczko kokosowe), odrobina mąki ziemniaczanej, 1 łyżeczka oliwy lub oleju kokosowego"],
 steps:["Naleśniki: składniki blendujemy do ujednolicenia. Smażymy na średnim ogniu z dwóch stron, czyszcząc patelnię przed każdym. Odkładamy na ręcznik.","Farsz: kurczaka kroimy bardzo drobno, szpinak szatkujemy. Na 1 łyżeczce tłuszczu smażymy kurczaka, aż zmieni kolor.","Dodajemy przyprawy, potem cebulę i szpinak. Smażymy, aż szpinak zmięknie, a kurczak się dosmaży.","Zmniejszamy ogień, dodajemy jogurt i odrobinę mąki ziemniaczanej, mieszamy do zgęstnienia.","Farsz przekładamy na naleśniki, składamy w ćwiartki i obsmażamy z dwóch stron lub podpiekamy."],
 note:"Wege: kurczaka zamień na tofu lub tempeh.",
 nutri:[{l:"całość",kcal:682,b:53,t:28,w:51},{l:"na porcję",kcal:227,b:18,t:9,w:17},{l:"w 100 g",kcal:136,b:11,t:6,w:10}]},

{cat:"Obiady", name:"Pasta Alfredo", portions:"1 porcja", time:"20 min",
 ing:["75g makaronu (oryginalnie fettuccine, może być dowolny)","30g żółtego sera","50ml mleka (może roślinne)","5-6 pomidorków koktajlowych","Odrobina oliwy z oliwek","1-2 łyżki świeżego tymianku (lub inne świeże zioła)","1 łyżeczka suszonego oregano","Szczypta gałki muszkatołowej lub ½ łyżeczki czosnku granulowanego","Szczypta soli, pieprz z młynka"],
 steps:["Pomidorki kroimy na pół i pieczemy w 200°C ok. 10-12 minut.","Makaron gotujemy al dente i odcedzamy.","Na głęboką patelnię wlewamy 50ml mleka, podgrzewamy. Dodajemy makaron, starty ser, zioła, przyprawy i sól. Mieszamy, aż ser się stopi i powstanie gęsty sos.","Przekładamy na talerz, na wierzch upieczone pomidorki, opcjonalnie kropla oliwy."],
 note:"Wege: ser zastąp wegańskim na bazie oleju kokosowego i skrobi, mleko dowolnym roślinnym.",
 nutri:[{l:"całość",kcal:384,b:20,t:10,w:58},{l:"w 100 g",kcal:192,b:10,t:5,w:29}]},

{cat:"Obiady", name:"Penne All'arrabbiata", portions:"1 porcja", time:"15 min",
 ing:["100g makaronu (np. penne)","3 łyżki passaty pomidorowej","Przyprawy: szczypta soli, pieprz z młynka, 1 łyżeczka czosnku granulowanego, 3 szczypty oregano","1 łyżka słodzika","1 łyżka oliwy z oliwek (lub olej lniany, rzepakowy)","10g startego parmezanu lub innego żółtego sera","Ostra papryczka, do smaku","Do dekoracji: oregano lub bazylia"],
 steps:["Makaron gotujemy wg opakowania, dodając drobno skrojoną papryczkę. Odcedzamy.","Wersja na szybko: dodajemy passatę, przyprawy, słodzik, oliwę. Mieszamy, posypujemy serem i ziołami.","Wersja tradycyjna: na patelni smażymy papryczkę (można z odrobiną cebuli), dodajemy passatę, przyprawy, słodzik, gotujemy aż gorące.","Dodajemy makaron do sosu, mieszamy, przekładamy na talerz. Dekorujemy parmezanem i ziołami."],
 nutri:[{l:"całość",kcal:469,b:18,t:13,w:75},{l:"w 100 g",kcal:187,b:7,t:5,w:30}]},

{cat:"Obiady", name:"Pierogi Ruskie z Pieca", portions:"12 sztuk", time:"60 min (+ wyrastanie)",
 ing:["Ciasto: 400g mąki uniwersalnej typ 500, 1,5-2 łyżeczki drożdży instant, 250ml ciepłej wody, 2-3 solidne szczypty soli","Farsz: 500g ziemniaków (po obraniu), 150g twarogu chudego, 2 cebule drobno, 3 łyżki oliwy z oliwek, pieprz i sól","Do posmarowania: 1 jajo rozbełtane"],
 steps:["Ciasto: składniki mieszamy i zagniatamy w misce, potem w dłoniach 1-2 minuty, aż będzie plastyczne i nie lepi się. Odstawiamy pod ścierką do wyrośnięcia.","Farsz: ziemniaki kroimy, gotujemy do miękkości, odcedzamy, rozgniatamy na puree i studzimy. Mieszamy z twarogiem na gładko.","Cebulę szatkujemy drobno, smażymy na oliwie aż zmieni kolor, dodajemy do masy. Doprawiamy solą i pieprzem.","Ciasto dzielimy na porcje, wałkujemy owalne placki, podsypując mąką.","Nakładamy farsz, zwijamy, sklejamy brzegi palcami i widelcem. Nie nakładamy za dużo, lekko spłaszczamy.","Układamy na papierze, smarujemy jajkiem (oprócz spodu). Pieczemy 25 minut w 200°C (góra-dół).","Najlepsze ciepłe. Farsz po upieczeniu bardzo gorący, uważać żeby się nie oparzyć."],
 nutri:[{l:"całość",kcal:2287,b:83,t:37,w:397},{l:"na porcję",kcal:191,b:7,t:3,w:33},{l:"w 100 g",kcal:152,b:6,t:2,w:26}]},

{cat:"Obiady", name:"Pierś z Grilla w Sosie Hoisin", portions:"2 porcje (ok. 500g)", time:"25 min",
 ing:["ok. 450g piersi z kurczaka","Marynata: po ½ łyżeczki mielonego imbiru i czosnku granulowanego, 1 łyżeczka ciemnego sosu sojowego","2 łyżki rafinowanego oleju kokosowego (lub rafinowana oliwa, masło klarowane)","Warzywa: dymka, sezam, groszek strączkowy lub fasolka szparagowa lub zielona papryka","Sos hoisin: 1 łyżka powideł śliwkowych (lub syrop klonowy, miód), 1 łyżeczka ciemnego sosu sojowego, 50ml wrzątku, 1 łyżeczka mąki ziemniaczanej, po szczypcie mielonego imbiru, czosnku i chili, opcjonalnie kilka kropel oleju sezamowego"],
 steps:["Mięso kroimy na cienkie plastry, mieszamy z marynatą w misce.","Grillujemy na rozgrzanej patelni bez tłuszczu na średnim ogniu, obracając kawałki.","Gdy zmienią kolor, trzymamy jeszcze 30-60 sekund, dodajemy olej, trochę dymki i składniki sosu. Mieszamy, dodajemy mąkę ziemniaczaną, mieszamy do zgęstnienia. Groszek można grillować z kurczakiem lub zagotować osobno.","Przekładamy na talerze, dekorujemy dymką i sezamem. Podajemy z ryżem."],
 note:"Wege: kurczaka zamień na tofu lub tempeh. Wartości z ryżem dotyczą ⅓ całości i 50g ryżu.",
 nutri:[{l:"całość",kcal:815,b:104,t:25,w:34},{l:"na porcję",kcal:407,b:52,t:12,w:17},{l:"z ryżem",kcal:456,b:37,t:8,w:52}]},

{cat:"Obiady", name:"Pizza Diavola", portions:"4 porcje (1 mała pizza)", time:"30 min",
 ing:["Ciasto: 100g mąki (uniwersalna typ 500 lub bezglutenowa), 60ml ciepłej wody, solidna szczypta soli","Dodatki: 30-35g chudej wędliny drobiowej (lub pieczony kurczak, indyk), ok. 50g sera żółtego (3 plastry), kilka cienkich plastrów cebuli, 1 średnia pieczarka, 1 ostra papryczka, 3-4 plastry pomidora","Sos pomidorowy: 3 łyżki passaty, 1-2 łyżeczki erytrytolu, szczypta cayenne lub chili, szczypta oregano, szczypta czosnku granulowanego"],
 steps:["Przygotowujemy dodatki: kroimy cienko pomidora, wędlinę, cebulę, pieczarkę, mieszamy sos w misce.","Spód: mąkę mieszamy z ciepłą wodą, zagniatamy łyżką, potem w dłoniach. Rozwałkowujemy na cienki placek.","Zawijamy brzegi tworząc kwadrat. Smażymy na suchej patelni na średnio-dużym ogniu z dwóch stron do zarumienienia i pęcherzyków. Piekarnik rozgrzewamy do maksimum.","Na placek dajemy ser (2 plastry) i cebulę, posypujemy pieprzem i ziołami. Zapiekamy do rozpuszczenia sera.","Dodajemy wędlinę, pieczarkę, papryczkę, opcjonalnie pomidory. Pieczemy 4 minuty.","Rozprowadzamy sos, sypiemy pozostały ser, zapiekamy ponownie. Posypujemy oregano i pieprzem."],
 note:"Wege: ser zastąp wegańskim na bazie oleju kokosowego i skrobi. Wędlinę pomiń, dodaj więcej pieczarek lub użyj wegańskiej.",
 nutri:[{l:"całość",kcal:577,b:30,t:15,w:77},{l:"na porcję",kcal:144,b:8,t:4,w:19},{l:"w 100 g",kcal:165,b:9,t:4,w:22}]},

{cat:"Obiady", name:"Ramen Wegański", portions:"2 nieduże porcje", time:"75 min",
 ing:["Wywar: 1 litr wody, włoszczyzna (2 marchewki, kawałek selera, pora, kapusty, 1 cebula, 1 pietruszka, natka), 2cm imbiru, 1 łyżka sosu sojowego, 2 arkusze nori, kilka pieczarek, ząbek czosnku","Sos: 1 łyżka mleka sojowego, 1 płaska łyżeczka masła orzechowego gładkiego lub tahini (lub miso), 1 łyżeczka jasnego sosu sojowego, 1 łyżka oleju rafinowanego, kilka kropel octu, szczypta mielonego imbiru, opcjonalnie olej sezamowy, mirin lub sake","Dodatki: 100g makaronu ramen (lub połamane spaghetti), 100g tofu naturalnego, 2 spore pieczarki, sos teriyaki (1 łyżeczka ciemnego sosu sojowego, 1 łyżka syropu klonowego, szczypta imbiru), warzywa do wyboru (kukurydza, marchewka, groszek, kimchi, bambus, kiełki), dymka i sezam do dekoracji"],
 steps:["Wywar: wodę zagotowujemy, dodajemy umyte i skrojone warzywa, czosnek, imbir, nori, sos sojowy i pieczarki. Gotujemy godzinę z uchyloną pokrywką, potem odcedzamy.","Sos: składniki mieszamy rózgą, dodajemy wywar, mieszamy i próbujemy, doprawiamy. Całość przed podaniem bardzo gorąca.","Tofu i grzyby kroimy w plastry, grillujemy na rozgrzanej patelni do zarumienienia. Mieszamy z sosem teriyaki, odcedzamy.","Makaron gotujemy wg opakowania, przekładamy do talerzy, zalewamy zupą. Dodajemy tofu, grzyby i warzywa. Dekorujemy dymką i sezamem."],
 note:"Wersja wegetariańska: zamiast tofu 2 jaja gotowane na półmiękko. Porcja: zupa, 50g makaronu, 50g tofu, łyżka kukurydzy.",
 nutri:[{l:"całość",kcal:655,b:29,t:19,w:93},{l:"na porcję",kcal:328,b:15,t:9,w:46},{l:"w 100 g",kcal:218,b:10,t:6,w:31}]},

{cat:"Obiady", name:"Szybka Pomidorówka", portions:"1 duża lub 2 małe porcje", time:"20 min",
 ing:["400ml bulionu warzywnego (świeży lub ½ kostki + 400ml wody)","200ml passaty pomidorowej","1 ząbek czosnku, na kawałki","1 szalotka lub mały kawałek cebuli","2 ziarna ziela angielskiego","2 listki laurowe","Pieprz czarny mielony, do smaku","1 łyżka oliwy z oliwek"],
 steps:["Do zagotowanego bulionu dodajemy passatę, czosnek, cebulę, liść laurowy, ziele angielskie i pieprz. Mieszamy. Gotujemy 15 minut, mieszając co 2-3 minuty. Zupa ma parować, ale nie bulgotać.","Odcedzamy na sitku, dodajemy oliwę i mieszamy. Doprawiamy. Podajemy z makaronem, ryżem lub ziemniakami."],
 note:"Wartość całość dotyczy samej zupy. Na każdą porcję 50g makaronu (waga przed ugotowaniem).",
 nutri:[{l:"całość",kcal:163,b:3,t:9,w:18}]},

{cat:"Obiady", name:"Tajskie Curry", portions:"2 porcje (ok. 500g)", time:"25 min",
 ing:["300g piersi z kurczaka lub indyka","Marynata: po ½ łyżeczki mielonego imbiru i chili lub cayenne","100g zielonej fasolki szparagowej (mrożoną przelać ciepłą wodą)","½ średniej cebuli","Opcjonalnie: 1 łyżeczka sosu sojowego","Sos curry: ostra papryczka do smaku, ½ średniej cebuli, 1 ząbek czosnku i kawałek imbiru startego, szczypta soli i pieprzu, trochę startej skórki z limonki, 200ml mleczka kokosowego (min. 12%), opcjonalnie kolendra, ½ łyżeczki mielonej kolendry, szczypta kminu rzymskiego"],
 steps:["Kurczaka kroimy na równe kawałki, obtaczamy w imbirze i chili.","Sos curry: wszystkie składniki blendujemy do ujednolicenia.","Na rozgrzanej patelni lub woku grillujemy kurczaka bez tłuszczu, aż zmieni kolor.","Dodajemy fasolkę, cebulę, sos curry, opcjonalnie sos sojowy. Można dodać papryczkę i skórkę z limonki. Mieszamy.","Gotujemy ok. 5 minut, mieszając. Można dodać 1 łyżkę mąki ziemniaczanej dla zagęszczenia. Podajemy z ryżem."],
 note:"Wege: kurczaka zamień na tofu lub tempeh. Wartości z ryżem dotyczą ⅓ całości i 50g ryżu.",
 nutri:[{l:"całość",kcal:783,b:72,t:51,w:3},{l:"na porcję",kcal:391,b:36,t:25,w:2},{l:"z ryżem",kcal:446,b:27,t:17,w:42}]},

{cat:"Obiady", name:"Tikka Masala", portions:"2 porcje (ok. 500-600g)", time:"40 min",
 ing:["400-450g piersi z kurczaka lub indyka","Przyprawy do mięsa: 1 łyżeczka papryki słodkiej, 1 łyżeczka kminu rzymskiego, 1 łyżeczka czosnku granulowanego, 1 łyżeczka chili lub cayenne, szczypta soli, szczypta mielonego imbiru","Sos: ⅓ średniej cebuli, 1 łyżeczka czosnku granulowanego lub 1 ząbek, szczypta imbiru, 1 łyżeczka kminu rzymskiego lub garam masala, 4 łyżki jogurtu naturalnego lub roślinnego, 2 łyżki passaty, 1 łyżka erytrytolu, sól i pieprz, szczypta mielonej kolendry, 2 łyżki masła klarowanego lub bezzapachowy olej"],
 steps:["Mięso kroimy na 3-4 duże kawałki, odkrawamy tłuszcz, obtaczamy w przyprawach. Pieczemy na folii ok. 25 minut w 180°C (góra-dół).","Sos: jogurt, passatę, cebulę, czosnek, przyprawy i słodzik blendujemy. Przelewamy na wysoką patelnię. Sos ma być gotowy zanim mięso się upiecze.","Upieczone mięso kroimy na kawałki ok. 3 cm. Do sosu dodajemy masło klarowane, podgrzewamy. Dodajemy mięso, mieszamy i obtaczamy. Nie podgrzewamy za długo. Można dodać mąkę ziemniaczaną dla zagęszczenia.","Przekładamy do misek, dekorujemy kolendrą lub kozieradką i pieprzem."],
 note:"Wege: kurczaka zamień na tofu lub tempeh, grillowane do zarumienienia, marynatę pomiń. Wartości z ryżem dotyczą ⅓ całości i 50g ryżu.",
 nutri:[{l:"całość",kcal:676,b:107,t:23,w:3},{l:"na porcję",kcal:338,b:53,t:11,w:2},{l:"z ryżem",kcal:410,b:38,t:8,w:42}]},
{cat:"Fast food", name:"Bułki do Burgerów", portions:"3 bułki", time:"90 min (z wyrastaniem)",
 ing:["150g mąki uniwersalnej typ 450-550 (lub bezglutenowa mieszanka do wypieków)","Solidna szczypta soli","1 łyżeczka drożdży instant","100ml ciepłej wody (bezglutenowa 125ml)","Do posmarowania i posypania: 1 żółtko, 1 łyżeczka mleka, ziarna sezamu"],
 steps:["Mąkę mieszamy z drożdżami i solą, dolewamy ciepłą wodę. Zagniatamy łyżką, potem w dłoniach 1-2 minuty. Wkładamy do natłuszczonej miski, posypujemy mąką, nakrywamy ścierką, odstawiamy w ciepłe miejsce na 30-60 minut.","Wyrośnięte ciasto dzielimy na 3 porcje, formujemy kulki, rozpłaszczamy na placki o średnicy 10-12cm na papierze posypanym mąką.","Smarujemy delikatnie olejem, nakrywamy folią, odstawiamy na 30 minut.","Żółtko mieszamy z łyżeczką mleka, smarujemy placki pędzlem, posypujemy obficie sezamem.","Pieczemy 15 minut w 200°C. Od razu po wyjęciu przykrywamy ręcznikiem i trzymamy pod przykryciem 1-2 godziny."],
 nutri:[{l:"całość",kcal:549,b:15,t:2,w:114},{l:"na porcję",kcal:183,b:5,t:1,w:38},{l:"w 100 g",kcal:261,b:7,t:1,w:54}]},

{cat:"Fast food", name:"Bułka Pita", portions:"1 chlebek na 2 porcje", time:"60 min (z wyrastaniem)",
 ing:["ok. 150g mąki zbożowej typ 450-550 (lub bezglutenowa mieszanka)","1 łyżeczka drożdży instant","100ml ciepłej wody (bezglutenowa 125ml)","Szczypta soli"],
 steps:["Mąkę mieszamy z drożdżami i solą, dolewamy ciepłą wodę. Zagniatamy łyżką, potem w dłoniach 1-2 minuty, aż ciasto będzie plastyczne. Wkładamy do natłuszczonej miski, posypujemy mąką, nakrywamy ścierką, odstawiamy na 30-60 minut.","Wyrośnięte ciasto zagniatamy raz jeszcze, wałkujemy na owalny placek ok. 22-25cm na 15-17cm.","Przekładamy na blaszkę posypaną mąką, pieczemy 15 minut w 200°C. Pita ma wyrosnąć i lekko się zarumienić. Studzimy.","Po wystudzeniu kroimy ostrożnie na dwie części."],
 note:"Baza do kebaba. Można przekroić od razu po wyjęciu, ale uważać żeby się nie poparzyć.",
 nutri:[]},

{cat:"Fast food", name:"Burrito", portions:"4 małe porcje", time:"20 min",
 ing:["2 tortille (przepis w tym zbiorze)","ok. 100g mielonego mięsa (drobiowe w wersji lżejszej lub wołowe)","2-3 łyżki fasoli z puszki","Mały kawałek zielonej papryki, drobno","Mały kawałek cebuli, drobno","1 łyżeczka oliwy lub oleju kokosowego do smażenia","Sos: 1-2 łyżki passaty, 1 łyżka jogurtu naturalnego lub roślinnego, 1 łyżeczka cayenne lub chili, 1 łyżeczka papryki wędzonej (wersja drobiowa i wegańska), szczypta soli i pieprzu, oregano, 2 łyżeczki erytrytolu","Dodatki: żółty ser w słupkach, ½ awokado w plastrach, ugotowany ryż, kolendra"],
 steps:["Na rozgrzanym tłuszczu smażymy mięso, mieszając. Gdy zmieni kolor, dodajemy paprykę i cebulę. Smażymy aż cebula się zeszkli.","Dodajemy fasolę i składniki sosu. Smażymy 2 minuty, aż woda odparuje i sos zgęstnieje.","Tortille rozkładamy na folii aluminiowej. Na środku farsz, awokado, ser i inne dodatki. Składamy boki i zwijamy w rulon. Owijamy folią. Kroimy każdą tortillę na pół, dając cztery porcje."],
 note:"Wege: mięso zamień na ugotowaną kaszę gryczaną. Wartości dla wersji drobiowej z awokado.",
 nutri:[{l:"całość",kcal:861,b:41,t:20,w:126},{l:"na porcję",kcal:215,b:10,t:5,w:32},{l:"w 100 g",kcal:172,b:8,t:4,w:25}]},

{cat:"Fast food", name:"Calzone", portions:"2 porcje", time:"50 min (z wyrastaniem)",
 ing:["Ciasto: 150g mąki pszennej lub żytniej typ 500-720 (lub bezglutenowa), 1 łyżeczka drożdży instant, 100ml ciepłej wody, szczypta soli, opcjonalnie czosnek granulowany","Farsz: ok. 70g chudej wędliny drobiowej (lub pierś z kurczaka, indyka w paskach), przyprawy (pieprz, sól, czosnek granulowany, papryka słodka, oregano), 50g sera żółtego (mozzarella), 1 średnia pieczarka, mały kawałek cebuli, ½ ostrej papryczki","Ziołowy sos pomidorowy (przepis w tym zbiorze)","Opcjonalnie: świeża bazylia lub oregano"],
 steps:["Ciasto: mąkę mieszamy z drożdżami i solą, dodajemy ciepłą wodę. Zagniatamy łyżką, potem natłuszczonymi dłońmi 1-2 minuty. Odstawiamy do wyrośnięcia na 30-40 minut.","Wyrośnięte ciasto zagniatamy i rozwałkowujemy na owalny placek, niezbyt cienki. Przekładamy na blaszkę posypaną mąką.","Farsz: wędlinę obtaczamy w przyprawach. Dodajemy 25g sera, cebulę, papryczkę, pieczarkę, czosnek, oregano, sól. Mieszamy.","Na środku placka kładziemy pozostałe 25g sera, potem farsz i 2-3 łyżki sosu. Zawijamy jak wielkiego pieroga, sklejamy brzegi widelcem.","Pieczemy 28-30 minut w 200°C, aż się zarumieni. Kroimy przez środek. Podajemy z sosem pomidorowym."],
 note:"Wege: farsz z większej ilości pieczarek i papryki. Ser zastąp wegańskim na bazie oleju kokosowego i skrobi.",
 nutri:[{l:"całość",kcal:776,b:42,t:14,w:115},{l:"na porcję",kcal:388,b:21,t:7,w:58},{l:"w 100 g",kcal:194,b:11,t:3,w:29}]},

{cat:"Fast food", name:"Frytki", portions:"1 duża lub 2 mniejsze porcje", time:"30 min",
 ing:["ok. 750g ziemniaków (waga po obraniu)","Przyprawy: sól, papryka słodka, pieprz ziołowy, chili lub cayenne","1 łyżka oliwy z oliwek"],
 steps:["Ziemniaki obieramy, kroimy w słupki ok. 1 cm, starannie osuszamy ręcznikami. Obtaczamy w przyprawach.","Rozkładamy na papierze do pieczenia, najlepiej żeby się nie stykały. Pieczemy w 200°C przez 25 minut.","Po upieczeniu mieszamy z oliwą. Doprawiamy do smaku."],
 nutri:[{l:"całość",kcal:663,b:15,t:9,w:135},{l:"na porcję",kcal:331,b:8,t:5,w:68},{l:"w 100 g",kcal:133,b:3,t:2,w:27}]},

{cat:"Fast food", name:"Hot Dogi", portions:"2 porcje", time:"20 min",
 ing:["1 bagietka ok. 150g","100g piersi z kurczaka lub indyka","Przyprawy do mięsa: 1 łyżeczka papryki wędzonej, szczypta soli, pieprz, szczypta czosnku granulowanego","1 łyżeczka masła klarowanego (lub oliwa, olej roślinny)","Ziołowy sos pomidorowy lub ostry sos orientalny (przepisy w tym zbiorze)","Musztarda"],
 steps:["Kurczaka kroimy w cienkie paski, obtaczamy w przyprawach. Grillujemy na suchej patelni na średnim ogniu, obracając po zarumienieniu. Uważać żeby nie przesuszyć.","Bagietkę kroimy na dwie bagiety, wydrążamy środek (łyżeczką lub widelcem). Opiekamy w mocno rozgrzanym piekarniku, aż będą chrupiące.","Mięso przekładamy do miski, dodajemy masło i obtaczamy.","Bułki napełniamy na zmianę sosem, musztardą i mięsem."],
 note:"Wege: mięso zamień na tofu skrojone w słupki.",
 nutri:[{l:"całość",kcal:407,b:36,t:10,w:41},{l:"na porcję",kcal:204,b:18,t:5,w:21}]},

{cat:"Fast food", name:"Kebab", portions:"2 kebaby", time:"60 min (z wyrastaniem pity)",
 ing:["1 domowa bułka pita, przekrojona na pół (przepis w tym zbiorze)","ok. 300g piersi z kurczaka lub indyka","Przyprawy do mięsa: po szczypcie papryki słodkiej, pieprzu ziołowego, chili lub cayenne, po małej szczypcie kminu rzymskiego, cynamonu, soli i czosnku granulowanego","1-1,5 łyżki oliwy z oliwek (lub olej rzepakowy, lniany, masło klarowane)","Warzywa: ogórek, pomidor, czerwona cebula, kapusta lub sałata","Sos majonezowy (przepis w tym zbiorze)"],
 steps:["Pitę przygotowujemy wg przepisu w tym zbiorze.","Pierś w dużych kawałkach (100-150g) obtaczamy w przyprawach. Pieczemy ok. 25-30 minut w 180°C na folii. Alternatywnie małe kawałki (2cm) ok. 12-13 minut, ale mięso będzie mniej soczyste.","Po upieczeniu kroimy na małe kawałki, polewamy oliwą i obtaczamy.","Pity napełniamy mięsem i warzywami. Wstawiamy do mocno rozgrzanego piekarnika na parę minut. Dodajemy sos."],
 note:"Wege: kurczaka zamień na tofu w plastrach, grillowane na suchej patelni do zarumienienia.",

{cat:"Fast food", name:"Kurczak Chrupiący", portions:"2 porcje (ok. 300g)", time:"25 min",
 ing:["ok. 200-250g piersi z kurczaka lub indyka","1 jajo kurze","ok. 50g panko (lub domowe, opis w notatce)","Opcjonalnie: 1-2 łyżki oliwy z oliwek (lub olej lniany, rzepakowy, masło klarowane)","Przyprawy: sól, pieprz, papryka ostra, chili lub cayenne"],
 steps:["Kurczaka kroimy w cienkie paski, obtaczamy w przyprawach. Panko mieszamy z ½ łyżeczki chili i 1 łyżeczką papryki słodkiej.","Kawałki maczamy w rozbełtanym jajku, potem obtaczamy w panko. Układamy na papierze do pieczenia.","Pieczemy ok. 15 minut w 180°C, czas zależy od grubości. Na ostatnie minuty można poodwracać.","Polewamy ostrym sosem orientalnym, można dodać oliwę."],
 note:"Domowe panko: wydrążone pieczywo (może bezglutenowe) bez skórek pokruszyć lub przemielić na małe kawałki i suszyć w 120-150°C do całkowitego wysuszenia, nie podpiekać. Wege: kurczaka zamień na tofu.",
 nutri:[{l:"całość",kcal:622,b:64,t:17,w:42},{l:"na porcję",kcal:311,b:32,t:8,w:21},{l:"w 100 g",kcal:207,b:21,t:6,w:14}]},

{cat:"Fast food", name:"Kurczak Słodko-Kwaśny", portions:"2 porcje", time:"25 min",
 ing:["ok. 400-450g piersi z kurczaka lub indyka, w małych kawałkach","Warzywa: 1 marchewka, ½ zielonej papryki, ½ czerwonej papryki, 1 mała cebula lub szalotka","ok. 100-150g ananasa na kawałki (świeży lub z puszki)","1 ząbek czosnku i kawałek imbiru, starte","Opcjonalnie: pędy bambusa","3 łyżki oliwy lub rafinowanego oleju kokosowego do smażenia","Sos słodko-kwaśny: 2-3 łyżki passaty, 1-2 łyżki słodzika, 50-100ml soku z pomarańczy lub zblendowanego ananasa, papryka słodka i trochę chili, trochę sosu sojowego, 1 łyżeczka mąki ziemniaczanej"],
 steps:["Marchewkę w paskach gotujemy kilka minut do miękkości (krócej dla chrupiącej). Odcedzamy.","Na woku lub patelni smażymy kurczaka na dużym ogniu, mieszając, aż zmieni kolor.","Dodajemy warzywa, imbir, czosnek, opcjonalnie bambus. Smażymy parę minut, aż warzywa się podsmażą. Uważać żeby nie przesuszyć mięsa.","Zmniejszamy ogień, dodajemy składniki sosu, mieszamy aż zgęstnieje. Ananasa dodajemy na końcu lub w trakcie. Podajemy z ryżem."],
 note:"Wege: kurczaka zamień na tofu lub tempeh, albo zrób sam ryż z warzywami w sosie. Wartości z ryżem dotyczą ⅓ całości i 50g ryżu.",
 nutri:[{l:"całość",kcal:770,b:94,t:31,w:20},{l:"na porcję",kcal:385,b:47,t:16,w:10},{l:"z ryżem",kcal:439,b:35,t:11,w:48}]},

{cat:"Fast food", name:"Kurrito", portions:"2 porcje", time:"20 min",
 ing:["1 tortilla (przepis w tym zbiorze)","ok. 75-100g piersi z kurczaka lub indyka","Przyprawy do mięsa (po szczypcie): sól, pieprz, papryka słodka, papryka wędzona, czosnek granulowany","50g dowolnego sera (mozzarella)","Sos BBQ: 2 łyżki passaty, 1 łyżeczka słodzika, ½ łyżeczki papryki wędzonej, pieprz, ½ łyżeczki ciemnego sosu sojowego"],

 note:"Wege: kurczaka zamień na tofu lub tempeh, ser na wegański na bazie oleju kokosowego i skrobi.",
 nutri:[{l:"całość",kcal:507,b:36,t:13,w:58},{l:"na porcję",kcal:254,b:18,t:6,w:29},{l:"w 100 g",kcal:184,b:13,t:5,w:21}]},

{cat:"Fast food", name:"Nuggetsy", portions:"3 małe lub 2 duże porcje", time:"25 min",
 ing:["ok. 450g piersi z kurczaka lub indyka","50-60g bułki tartej lub mąki (może razowa, w wersji bezglutenowej ryżowa, kukurydziana, amarantusowa)","1 jajo kurze (L)","Przyprawy do mięsa: chili lub cayenne, szczypta soli i pieprzu, papryka słodka, czosnek granulowany, pieprz ziołowy (w sumie ok. 3 łyżki)","Kilka łyżek oliwy lub oleju kokosowego do smażenia"],

 note:"Wege: kurczaka zamień na tofu.",
 nutri:[{l:"całość",kcal:1024,b:119,t:38,w:43},{l:"na porcję",kcal:341,b:40,t:13,w:14},{l:"w 100 g",kcal:186,b:22,t:7,w:8}]},

{cat:"Fast food", name:"Pikantny Chickenburger", portions:"1 porcja", time:"20 min",
 ing:["1 bułka ok. 60-75g (może domowa, przepis w tym zbiorze)","1 kotlet drobiowy w panierce (poniżej)","1-2 liście sałaty rzymskiej","Sos majonezowy (przepis w tym zbiorze)","Kotlet: ok. 75g piersi z kurczaka lub indyka (płaski kawałek), 1 łyżeczka cayenne lub chili, szczypta soli i pieprzu, 1 małe jajo, 1-2 łyżki bułki tartej lub panko lub mąki, 1-2 łyżeczki oliwy lub oleju kokosowego do smażenia"],
 steps:["Płaski kawałek mięsa obtaczamy w przyprawach, maczamy w jajku, obtaczamy w mące lub bułce tartej.","Smażymy na rozgrzanym tłuszczu z dwóch stron na średnim ogniu, aż się zarumieni.","Bułkę kroimy na pół, podpiekamy w piekarniku, potem grillujemy od środka na suchej patelni do chrupkości.","Bułkę smarujemy sosem z dwóch stron, dodajemy sałatę, kotlet i sos majonezowy."],

 nutri:[{l:"całość",kcal:402,b:30,t:12,w:41},{l:"w 100 g",kcal:230,b:17,t:7,w:23}]},

const CATS = ["Wszystkie","Śniadania","Drugie śniadania","Obiady","Fast food","Dodatki słodkie","Dodatki wytrawne","Szybkie surówki","Napoje"];
let activeCat = "Wszystkie";
let query = "";

const grid = document.getElementById('grid');
const tabsEl = document.getElementById('tabs');
const countEl = document.getElementById('count');
const emptyEl = document.getElementById('empty');

CATS.forEach(c=>{
  const b=document.createElement('button');
  b.className='tab'+(c==='Wszystkie'?' active':'');
  b.textContent=c;
  b.onclick=()=>{activeCat=c;[...tabsEl.children].forEach(x=>x.classList.remove('active'));b.classList.add('active');render();};
  tabsEl.appendChild(b);
});

function macroChips(n){
  if(!n||!n.length) return '';
  const f=n[0];
  return `<span class="macro">B <b>${f.b}</b></span><span class="macro">T <b>${f.t}</b></span><span class="macro">W <b>${f.w}</b></span>`;
}

function render(){
  const q=query.trim().toLowerCase();
  const list=RECIPES.filter(r=>{
    if(activeCat!=='Wszystkie' && r.cat!==activeCat) return false;
    if(!q) return true;
    if(r.name.toLowerCase().includes(q)) return true;
    return r.ing.some(i=>i.toLowerCase().includes(q));
  });
  grid.innerHTML='';
  list.forEach((r,idx)=>{
    const i=RECIPES.indexOf(r);
    const card=document.createElement('div');
    card.className='card';
    const kcal = r.nutri && r.nutri.length ? `<span class="kcal">${r.nutri[0].kcal} kcal</span>` : '<span class="kcal" style="color:var(--muted)">&mdash;</span>';
    card.innerHTML=`
      <span class="cat">${r.cat}</span>
      <h3>${r.name}</h3>
      <div class="macros">${macroChips(r.nutri)}</div>
      <div class="meta">
        ${kcal}
        <span class="time">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
          ${r.time}
        </span>
      </div>`;
    card.onclick=()=>openModal(i);
    grid.appendChild(card);
  });
  emptyEl.style.display=list.length?'none':'block';
  countEl.textContent=`${list.length} ${list.length===1?'przepis':(list.length%10>=2&&list.length%10<=4&&!(list.length>=12&&list.length<=14))?'przepisy':'przepisów'}`;
}

const overlay=document.getElementById('overlay');
const modal=document.getElementById('modal');

function nutriTable(n){
  if(!n||!n.length) return '';
  const rows=n.map(x=>`<tr><td>${x.l}</td><td class="kc">${x.kcal}</td><td>${x.b}</td><td>${x.t}</td><td>${x.w}</td></tr>`).join('');
  return `<div class="nutri"><table>
    <thead><tr><th style="text-align:left">Wartość</th><th>kcal</th><th>B</th><th>T</th><th>W</th></tr></thead>
    <tbody>${rows}</tbody></table></div>`;
}

function openModal(i){
  const r=RECIPES[i];
  modal.innerHTML=`
    <div class="modal-head">
      <button class="close" onclick="closeModal()" aria-label="Zamknij">&times;</button>
      <span class="cat">${r.cat}</span>
      <h2>${r.name}</h2>
      <span class="sub">${r.portions} &middot; ${r.time}</span>
    </div>
    <div class="modal-body">
      <h4>Składniki</h4>
      <ul>${r.ing.map(x=>`<li>${x}</li>`).join('')}</ul>
      <h4>Przygotowanie</h4>
      <ol>${r.steps.map(x=>`<li>${x}</li>`).join('')}</ol>
      ${r.note?`<p class="note">${r.note}</p>`:''}
      ${nutriTable(r.nutri)}
    </div>`;
  overlay.classList.add('open');
  document.body.style.overflow='hidden';
  modal.querySelector('.modal-body').scrollTop=0;
}
function closeModal(){overlay.classList.remove('open');document.body.style.overflow='';}
overlay.addEventListener('click',e=>{if(e.target===overlay)closeModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

document.getElementById('search').addEventListener('input',e=>{query=e.target.value;render();});

render();
</script>
